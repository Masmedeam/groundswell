name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/groundswell_prod
          chmod 600 ~/.ssh/groundswell_prod
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Upload source to production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='backups' \
            --exclude='app/web/node_modules' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            -czf - . | ssh -i ~/.ssh/groundswell_prod -p "${PROD_PORT:-22}" "${PROD_USER}@${PROD_HOST}" '
              set -euo pipefail
              rm -rf /tmp/groundswell-release
              mkdir -p /tmp/groundswell-release
              tar -xzf - -C /tmp/groundswell-release
              cd /opt/groundswell
              rm -rf app groundswell docker config scripts data
              cp -a /tmp/groundswell-release/. /opt/groundswell/
              rm -rf /tmp/groundswell-release
            '

      - name: Rebuild and restart app containers
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/groundswell_prod -p "${PROD_PORT:-22}" "${PROD_USER}@${PROD_HOST}" 'bash -se' <<'EOF'
            set -euo pipefail
            cd /opt/groundswell/docker
            sudo docker-compose -f docker-compose.prod.yml up -d --no-deps --build groundswell-api groundswell-web
            sudo docker-compose -f docker-compose.prod.yml ps
            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health; then
                exit 0
              fi
              echo "API health check failed; retrying (${attempt}/30)"
              sleep 2
            done
            sudo docker logs --tail=120 groundswell-api
            exit 1
          EOF
