# Local single-node Elasticsearch + Kibana for Groundswell (dev only; security off).
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: groundswell-es
    hostname: es01
    extra_hosts:
      - "es01:127.0.0.1"
    environment:
      - discovery.type=single-node
      - network.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9201:9200"   # 9200 is used by another local ES on this machine
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: groundswell-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5602:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  groundswell-api:
    build:
      context: ..
      dockerfile: app/api/Dockerfile
    container_name: groundswell-api
    env_file: ../.env
    environment:
      - ES_URL=http://elasticsearch:9200
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  groundswell-web:
    build:
      context: ..
      dockerfile: app/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: groundswell-web
    ports:
      - "3000:3000"
    depends_on:
      - groundswell-api

volumes:
  esdata:
