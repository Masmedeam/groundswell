version: "2.4"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: groundswell-es
    hostname: es01
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - network.host=0.0.0.0
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "9201:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  groundswell-api:
    build: ../app/api
    container_name: groundswell-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      - ES_URL=http://elasticsearch:9200
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  groundswell-web:
    build:
      context: ../app/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://homestardata.com/api}
    container_name: groundswell-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - groundswell-api

volumes:
  esdata:
