# Groundswell demo metros — the reference table that drives ingestion.
# county names are listed WITHOUT the " County" suffix (crosswalk normalizes both sides).
# cbsa is informational for now; WARN rollup uses state + county membership.
metros:
  - metro_id: sf
    name: San Francisco
    zori_region: "San Francisco, CA"      # metro-level ZORI RegionName
    fred_nonfarm_id: SANF806NA
    warn_state: CA
    cbsa: "41860"                          # SF-Oakland-Berkeley MSA (FRED series is the 41884 MD)
    counties: ["San Francisco", "San Mateo", "Marin", "Alameda", "Contra Costa"]
  - metro_id: austin
