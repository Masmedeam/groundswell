# Full Zillow Research public-CSV catalog (slugs/files/levels live-verified).
# URL = {base}/{slug}/{Level}_{file}. Dead (dataset x level) combos are auto-skipped.
base: https://files.zillowstatic.com/research/public_csvs
datasets:
