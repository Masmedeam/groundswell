  - dataset: zori_allhomes_sm
    slug: zori
    file: zori_uc_sfrcondomfr_sm_month.csv
    levels: [Metro, City, County, Zip]
  - dataset: zori_allhomes_sm_sa
    slug: zori
    file: zori_uc_sfrcondomfr_sm_sa_month.csv
    levels: [Metro, Zip]
  - dataset: zori_sfr_sm
    slug: zori
    file: zori_uc_sfr_sm_month.csv
    levels: [Metro, Zip]
  - dataset: zori_sfr_sm_sa
